apply plugin: 'com.android.application'

// Releases are tagged with their date, YYYY.MM.DD, or YYYY.MM.DD.N for the Nth release
// that day. The tag is the app's version name, and its version code is the days since
// 1 January 2026 times 100, plus the release's number that day, so each release is
// higher than the one before, while staying far below Google Play's limit of
// 2,100,000,000. scripts/release/version.sh works it out the same way, so change both
// together.
//
// The nightly workflow writes both into android/version.properties in the release's
// own commit, as F-Droid reads them from there and can't work them out. RELEASE_TAG,
// when it's set, wins, for building a release locally. Until the first release, the
// file versions builds "dev", below them all
def releaseVersion = {
    def tag = System.getenv("RELEASE_TAG")
    if (!tag) {
        def properties = new Properties()
        rootProject.file("version.properties").withInputStream { properties.load(it) }
        return [code: properties.getProperty("versionCode").toInteger(), name: properties.getProperty("versionName")]
    }
    def date = tag =~ /^(\d{4})\.(\d{2})\.(\d{2})(?:\.(\d{1,2}))?$/
    if (!date.matches()) {
        throw new GradleException("RELEASE_TAG must be a date tag like 2026.10.30, or 2026.10.30.2 for a second release that day, not ${tag}")
    }
    def number = date.group(4) ? date.group(4).toInteger() : 1
    def day = java.time.LocalDate.of(date.group(1).toInteger(), date.group(2).toInteger(), date.group(3).toInteger())
    def days = java.time.temporal.ChronoUnit.DAYS.between(java.time.LocalDate.of(2026, 1, 1), day)
    return [code: (days * 100 + number) as int, name: tag]
}()

android {
    namespace "tech.tanay.diwali"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "tech.tanay.diwali"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersion.code
        versionName releaseVersion.name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Google Play takes the release bundle signed with its upload key, a keystore kept
    // out of the repository, which these name. Without them the release is unsigned
    def uploadKey = System.getenv("ANDROID_UPLOAD_KEYSTORE")
    signingConfigs {
        if (uploadKey) {
            upload {
                storeFile file(uploadKey)
                storePassword System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_UPLOAD_KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("ANDROID_UPLOAD_KEY_PASSWORD") ?: System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (uploadKey) {
                signingConfig signingConfigs.upload
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Prints the version a build gets, to check it: ./gradlew -q :app:printVersion
tasks.register("printVersion") {
    def code = android.defaultConfig.versionCode
    def name = android.defaultConfig.versionName
    doLast {
        println "${code} ${name}"
    }
}
