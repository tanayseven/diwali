name: Deploy to S3

on:
  push:
    branches:
      - main  # Change this to the branch you want to trigger the deploy on

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Every one of mise's protections, which it only takes from the environment
      MISE_PARANOID: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Node and aws, as locked in mise.lock: only these, not the desktop apps' tools
      - name: Setup tools with mise
        uses: jdx/mise-action@v5
        with:
          install_args: node aws-cli

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS Credentials OIDC login
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: 'arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-for-diwali'
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 cp dist/ s3://diwali.tanay.tech/ --recursive
          # CloudFront serves the bucket as it is, without S3's website hosting, so the
          # privacy policy's address, /privacy, is a page of its own, without the .html
          aws s3 cp dist/privacy.html s3://diwali.tanay.tech/privacy --content-type "text/html; charset=utf-8"
