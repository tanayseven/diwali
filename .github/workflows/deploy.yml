name: Deploy to S3

on:
  push:
    branches:
      - main  # Change this to the branch you want to trigger the deploy on

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup tools with mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Configure AWS Credentials OIDC login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: 'arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-for-diwali-ecard'
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 cp dist/ s3://wish-diwali.tanay.tech/ --recursive
