name: Android build

# When a release's date tag is pushed: YYYY.MM.DD, or YYYY.MM.DD.N for the Nth release
# that day. The build itself rejects any other shape of tag. The nightly release tag
# workflow calls it too, for the tag it's just made, as tags pushed by a workflow don't
# start others. It can be run by hand for a tag too, to build and release it again
on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]*'
  workflow_call:
    inputs:
      tag:
        description: The date tag to build and release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The date tag to build and release again, such as 2026.10.30
        required: true
        type: string

permissions:
  contents: write # This is required to create the release and attach the APK and bundle to it

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # The tag it was called with, or the one that was pushed
      TAG: ${{ inputs.tag || github.ref_name }}
      # Every one of mise's protections, which it only takes from the environment
      MISE_PARANOID: 1
      # The Google Play service account's key, to publish the bundle with. It's here, as
      # a secret can't be tested in a step's if
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          # With every tag, so the notes for Google Play can list what's changed since
          # the last release
          fetch-depth: 0

      # Node, Java and gh, as locked in mise.lock: only these, not the desktop apps' tools
      - name: Setup tools with mise
        uses: jdx/mise-action@v5
        with:
          install_args: node java gh

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      # The runner comes with the Android SDK, and Gradle fetches any part of it the
      # build needs that's missing. The tag versions the app
      - name: Build the APK
        env:
          RELEASE_TAG: ${{ env.TAG }}
        run: npm run android:build

      # The release bundle for Google Play, signed with its upload key, which the secrets
      # hold: the keystore in base64 and its password. Without them it's skipped
      - name: Build the app bundle for Google Play
        env:
          RELEASE_TAG: ${{ env.TAG }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "No upload key in the secrets, so no app bundle"
            exit 0
          fi
          export ANDROID_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload-keystore.jks"
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_UPLOAD_KEYSTORE"
          (cd android && ./gradlew bundleRelease)
          rm "$ANDROID_UPLOAD_KEYSTORE"
          cp android/app/build/outputs/bundle/release/app-release.aab "diwali-$TAG.aab"

      # The desktop build attaches its packages to the same release, so whichever gets
      # there first makes it, and the other adds to it
      - name: Attach the APK and the app bundle to a release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "diwali-$TAG.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes || true
          fi
          files=("diwali-$TAG.apk")
          if [ -f "diwali-$TAG.aab" ]; then
            files+=("diwali-$TAG.aab")
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      # What's new in it, for its users: F-Droid's changelog for it, which the release
      # commit carries, or for a tag from before those, the commits since the tag before it
      - name: Write the notes for Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != '' && hashFiles(format('diwali-{0}.aab', env.TAG)) != ''
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          notes="$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          changelog="fastlane/metadata/android/en-US/changelogs/$(scripts/release/version.sh "$TAG").txt"
          if [ -f "$changelog" ]; then
            cp "$changelog" "$notes"
          else
            scripts/release/notes.sh "$TAG" > "$notes"
          fi
          cat "$notes"

      # Uploads the bundle to Google Play and releases it to everyone on internal testing,
      # which Google doesn't review, so its testers get it first. Only once Play's set up,
      # with the service account's key in the secrets. Play refuses a version code it
      # already has, so a tag already published fails here, and a fix needs a new tag. The
      # action's pinned to its commit, as it's handed the key
      - name: Publish the app bundle to Google Play's internal testing
        id: play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != '' && hashFiles(format('diwali-{0}.aab', env.TAG)) != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: tech.tanay.diwali
          releaseFiles: diwali-${{ env.TAG }}.aab
          releaseName: ${{ env.TAG }}
          tracks: internal
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      # Then the same build, which Play now has, goes on its other tracks without being
      # uploaded again: to everyone on closed (alpha) testing, once Google's reviewed it.
      # Open testing (beta) and production are left out for now: Play refuses both
      # ("Precondition check failed") until a new personal account's closed test has run
      # long enough. Once it gives access, add back `beta production:0.2`, which releases
      # to everyone on open testing and to production as a staged rollout to a fifth of
      # its users. It's rolled out to everyone by hand in Play Console, and a newer
      # release replaces it. Each track's changed on its own, so one Play won't take, such
      # as a testing track that isn't set up, doesn't stop the others, and what Play said
      # is in the log. The script's taken from this workflow's own commit, which is never
      # older than the tag, so a fix to it applies when an older tag's run again
      - name: Release it on Google Play's closed testing
        if: steps.play.outcome == 'success'
        run: |
          git worktree add --detach "$RUNNER_TEMP/workflow" "$GITHUB_SHA"
          "$RUNNER_TEMP/workflow/scripts/release/play-release.sh" tech.tanay.diwali "$TAG" \
            "$RUNNER_TEMP/whatsnew/whatsnew-en-US" alpha
