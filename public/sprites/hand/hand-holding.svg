<?xml version="1.0" encoding="UTF-8"?>
<!-- A right hand seen from the back, pointing up, pinching between thumb and forefinger at (60 36) -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="400" viewBox="0 0 120 200">
<defs>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#E0A577"/><stop offset="60%" stop-color="#C98A5B"/><stop offset="100%" stop-color="#A86C42"/></linearGradient>
<linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#E8653A"/><stop offset="100%" stop-color="#B23A1C"/></linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
<!-- Kurta sleeve with a gold border -->
<path d="M46 150 L98 148 L104 200 L40 200 Z" fill="url(#sleeve)" stroke="#6E2410" stroke-width="2.5"/>
<path d="M45 150 L99 148 L100 160 L44 162 Z" fill="#F2C14E" stroke="#8A5F12" stroke-width="2"/>
<path d="M52 155 h4 M62 154.6 h4 M72 154.2 h4 M82 153.8 h4 M92 153.4 h3" stroke="#B5781A" stroke-width="2"/>
<!-- Outlines -->
<g stroke="#6B4023" fill="none">
<path d="M40 116 Q38 78 55 40" stroke-width="21"/>
<path d="M80 88 Q94 60 84 44 Q76 32 64 34" stroke-width="18"/>
<ellipse cx="91" cy="94" rx="10" ry="8.5" stroke-width="3" fill="#6B4023"/>
<ellipse cx="99" cy="107" rx="9.5" ry="8" stroke-width="3" fill="#6B4023"/>
<ellipse cx="102" cy="121" rx="8.5" ry="7" stroke-width="3" fill="#6B4023"/>
<path d="M34 104 Q40 84 70 86 Q100 86 106 108 Q110 132 98 151 L50 152 Q33 136 34 104 Z" stroke-width="3"/>
</g>
<!-- Back of the hand -->
<path d="M34 104 Q40 84 70 86 Q100 86 106 108 Q110 132 98 151 L50 152 Q33 136 34 104 Z" fill="url(#skin)"/>
<!-- Curled middle, ring and little fingers -->
<ellipse cx="91" cy="94" rx="10" ry="8.5" fill="#C98A5B"/>
<ellipse cx="99" cy="107" rx="9.5" ry="8" fill="#BB7D50"/>
<ellipse cx="102" cy="121" rx="8.5" ry="7" fill="#B07247"/>
<!-- Thumb -->
<path d="M40 116 Q38 78 55 40" stroke="#D99C6D" stroke-width="16" fill="none"/>
<path d="M35 98 Q35 78 46 56" stroke="#E8B48A" stroke-width="4" fill="none" stroke-opacity="0.6"/>
<!-- Forefinger -->
<path d="M80 88 Q94 60 84 44 Q76 32 64 34" stroke="#CF915F" stroke-width="13" fill="none"/>
<path d="M86 70 q5 -2 7 1 M84 47 q4 0 5 3" stroke="#8E5A35" stroke-width="1.6" fill="none"/>
<ellipse cx="69" cy="33" rx="5" ry="3.6" transform="rotate(-12 69 33)" fill="#F1C7A8" stroke="#A9714A" stroke-width="1"/>
<!-- Knuckles and tendons -->
<path d="M60 100 q4 18 0 38 M72 98 q4 18 2 40 M84 100 q2 16 0 34" stroke="#A86C42" stroke-width="1.4" fill="none" stroke-opacity="0.55"/>
<path d="M86 100 q4 -2 6 1 M95 111 q3 -1 5 1" stroke="#8E5A35" stroke-width="1.4" fill="none"/>
</g>
</svg>
