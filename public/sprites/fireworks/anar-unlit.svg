<svg xmlns="http://www.w3.org/2000/svg" width="416" height="288" viewBox="128 428 104 72">
  <title>Anar — Unlit</title>
  <defs>
    <linearGradient id="clay" gradientUnits="userSpaceOnUse" x1="360" y1="270" x2="0" y2="270">
      <stop offset="0" stop-color="#1E0E07"/>
      <stop offset="0.3" stop-color="#4A2414"/>
      <stop offset="0.55" stop-color="#9A5532"/>
      <stop offset="0.66" stop-color="#6A321A"/>
      <stop offset="1" stop-color="#241109"/>
    </linearGradient>
    <linearGradient id="paper" gradientUnits="userSpaceOnUse" x1="360" y1="270" x2="0" y2="270">
      <stop offset="0" stop-color="#2A0709"/>
