      <path id="gold-stripe" d="M167.5 465.5Q180 468.4 192.5 465.5" fill="none" stroke="#C9973A" stroke-width="1.1"/>
      <path id="wick" d="M180 446C179 440 183 437 182 431" fill="none" stroke="#BFB59E" stroke-width="1.2" stroke-linecap="round"/>
